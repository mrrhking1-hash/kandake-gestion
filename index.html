<!-- Kandake Gestion - shell applicatif (PWA) -->
<!DOCTYPE html><html class="light" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<title>Kandake Gestion · Maison &amp; Beauté</title>
<meta content="Pilotage de la boutique Kandake Maison &amp; Beauté : caisse, stocks, ventes et finances, disponible hors connexion." name="description">
<meta content="#000000" name="theme-color">
<meta content="light" name="color-scheme">
<meta content="yes" name="mobile-web-app-capable">
<meta content="yes" name="apple-mobile-web-app-capable">
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style">
<meta content="Kandake" name="apple-mobile-web-app-title">
<link href="manifest.json" rel="manifest">
<link href="icons/favicon.svg" rel="icon" type="image/svg+xml">
<link href="icons/icon-192.png" rel="icon" sizes="192x192" type="image/png">
<link href="icons/apple-touch-icon.png" rel="apple-touch-icon">
<link href="css/app.css" rel="stylesheet">
</head>
<body class="bg-surface font-body-md text-on-surface antialiased selection:bg-secondary-container selection:text-on-secondary-container">

<header class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_10px_rgba(0,0,0,0.05)]">
<div class="h-16 px-margin flex items-center justify-between gap-space-sm">
<div class="flex items-center gap-space-sm min-w-0">
<img alt="Kandake Logo" class="h-10 w-auto object-contain shrink-0" src="https://lh3.googleusercontent.com/aida/AEtjO1U3PdHyjtKfhOQUi9M-euQDsm_FtLaCQxzL8HfS-HNM_Zmvmnw7VVy4ZDzJIpWCWPiGOoO_Vev0mtLT7jVWm6Lwlk7JySTkP6rjcM9auG107hE0-G7FgwsvURel9xI9jl0LhlSLRipVLdBJldeD3MHjQpZBm5BS4KZWz9Qlq3eefGsoo0Mp51UKSjIlwsI52j7dqLmXNtNPHtVLPAhzCHxyFYQnEgQGoZ-MSt9akYrBGicctFIk5RX1foKJyUxHBPSVSpubAXmLn_A">
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-1.5">
<h1 class="font-label-sm text-[10px] uppercase tracking-[0.16em] text-secondary font-bold truncate">Kandake Maison &amp; Beauté</h1>
<span class="w-1.5 h-1.5 rounded-full bg-secondary shrink-0"></span>
</div>
</div>
</div>
<div class="flex items-center gap-1 shrink-0">
<button aria-label="Notifications" class="w-11 h-11 flex items-center justify-center relative text-on-surface-variant hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-[22px]">notifications</span>
<span id="notif-badge" class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-secondary ring-2 ring-surface-container-lowest transition-opacity duration-300 ease-out"></span>
</button>
<button aria-label="Profil gérante" class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-on-primary ring-1 ring-secondary/30 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]">person</span>
</button>
</div>
</div>
<!-- barre de progression des transitions (sous le header) -->
<div class="h-0.5 w-full overflow-hidden" id="route-bar" data-show="false">
<div class="h-full w-1/3 bg-secondary-container"></div>
</div>
</header>

<!-- une seule vue injectee ici : aucun rechargement de document -->
<div id="view-root" class="view-enter"></div>

<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/95 backdrop-blur-xl shadow-[0_-4px_16px_rgba(0,0,0,0.06)]">
<div class="flex justify-around items-center h-16 px-1">
<a class="nav-link flex flex-col items-center justify-center gap-0.5 flex-1 h-full min-h-[48px] text-on-surface-variant active:scale-95 transition-transform text-center" data-path="dashboard" data-route="accueil" href="#/accueil">
<span class="material-symbols-outlined text-[20px]">grid_view</span>
<span class="font-label-sm text-[10px] tracking-normal leading-tight">Accueil</span>
</a>
<a class="nav-link flex flex-col items-center justify-center gap-0.5 flex-1 h-full min-h-[48px] text-on-surface-variant active:scale-95 transition-transform text-center" data-path="stocks" data-route="stocks" href="#/stocks">
<span class="material-symbols-outlined text-[20px]">inventory_2</span>
<span class="font-label-sm text-[10px] tracking-normal leading-tight">Stocks</span>
</a>
<a class="nav-link flex flex-col items-center justify-center gap-0.5 flex-1 h-full min-h-[48px] text-on-surface-variant active:scale-95 transition-transform text-center" data-path="pos" data-route="caisse" href="#/caisse">
<span class="material-symbols-outlined text-[20px]">point_of_sale</span>
<span class="font-label-sm text-[10px] tracking-normal leading-tight">Caisse</span>
</a>
<a class="nav-link flex flex-col items-center justify-center gap-0.5 flex-1 h-full min-h-[48px] text-on-surface-variant active:scale-95 transition-transform text-center" data-path="orders" data-route="ventes" href="#/ventes">
<span class="material-symbols-outlined text-[20px]">receipt_long</span>
<span class="font-label-sm text-[10px] tracking-normal leading-tight">Ventes</span>
</a>
<a class="nav-link flex flex-col items-center justify-center gap-0.5 flex-1 h-full min-h-[48px] text-on-surface-variant active:scale-95 transition-transform text-center" data-path="finance" data-route="finances" href="#/finances">
<span class="material-symbols-outlined text-[20px]">account_balance_wallet</span>
<span class="font-label-sm text-[10px] tracking-normal leading-tight">Finances</span>
</a>
<a class="nav-link flex flex-col items-center justify-center gap-0.5 flex-1 h-full min-h-[48px] text-on-surface-variant active:scale-95 transition-transform text-center" data-path="settings" data-route="reglages" href="#/reglages">
<span class="material-symbols-outlined text-[20px]">settings</span>
<span class="font-label-sm text-[10px] tracking-normal leading-tight">Réglages</span>
</a>
</div>
</nav>

<script src="js/app.js"></script>
<script src="js/router.js"></script>
<script src="js/pull-refresh.js"></script>
</body></html>
